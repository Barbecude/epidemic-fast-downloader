<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epidemic Sound Fast Downloader</title>
    <script src="env.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }
        .container {
            background: #18181d;
            border: 2px solid #2a2a35;
            padding: 36px;
            border-radius: 20px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
            color: #00e676;
        }
        .main-input {
            width: 100%;
            padding: 22px;
            font-size: 24px;
            font-weight: 900;
            border: 3px solid #333;
            border-radius: 14px;
            background: #22222a;
            color: #fff;
            margin-bottom: 18px;
            outline: none;
        }
        .main-input:focus { border-color: #00e676; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        button {
            padding: 20px;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { opacity: 0.92; transform: translateY(-2px); }
        button:active { transform: scale(0.98); }
        .btn-track { background: #00c853; color: #000; }
        .btn-stems { background: #2979ff; }
        .btn-sfx { background: #ff9100; color: #000; }
        .status {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            background: #22222a;
            color: #00e676;
        }
        .results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .item {
            background: #22222a;
            border: 2px solid #333;
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .item-info { flex: 1; }
        .item-title { font-size: 20px; font-weight: 900; color: #fff; }
        .item-sub { font-size: 15px; font-weight: 700; color: #999; margin-top: 4px; }
        .dl-btn {
            padding: 14px 20px;
            font-size: 18px;
            font-weight: 900;
            background: #00e676;
            color: #000;
            border-radius: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ EPIDEMIC FAST DL</h1>

    <input type="text" id="queryInput" class="main-input" placeholder="Paste Link / Track ID / Search..." autofocus>

    <div class="btn-group">
        <button class="btn-track" onclick="handleAction('track')">⬇ DOWNLOAD TRACK (320KBPS)</button>
        <button class="btn-stems" onclick="handleAction('stems')">🎛 DOWNLOAD STEMS / WAV</button>
        <button class="btn-sfx" onclick="handleAction('sfx')">🔊 DOWNLOAD SFX</button>
    </div>

    <div class="status" id="status">SIAP DOWNLOAD CEPAT</div>
    <div class="results" id="results"></div>
</div>

<script>
    const API_BASE = 'https://partner-content-api.epidemicsound.com/v0';
    let API_KEY = window.EPIDEMIC_API_KEY || '';

    const queryInput = document.getElementById('queryInput');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    // Fallback baca dari .env jika dijalankan lewat HTTP server
    if (!API_KEY) {
        fetch('.env')
            .then(r => r.ok ? r.text() : '')
            .then(text => {
                const match = text.match(/^\s*EPIDEMIC_API_KEY\s*=\s*(.+)\s*$/m);
                if (match && match[1]) API_KEY = match[1].trim().replace(/^['"]|['"]$/g, '');
            })
            .catch(() => {});
    }

    queryInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleAction('track');
    });

    function extractId(input) {
        const uuidMatch = input.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        if (uuidMatch) return uuidMatch[0];
        if (input.includes('epidemicsound.com/')) {
            const cleanUrl = input.split('?')[0];
            const parts = cleanUrl.split('/').filter(Boolean);
            return parts[parts.length - 1].replace(/-/g, ' ');
        }
        return null;
    }

    function setStatus(msg, color = '#00e676') {
        statusEl.style.color = color;
        statusEl.innerText = msg;
    }

    async function apiFetch(path, options = {}) {
        if (!API_KEY) throw new Error('API Key belum terpasang di .env / env.js!');
        const res = await fetch(`${API_BASE}${path}`, {
            ...options,
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`,
                ...(options.headers || {})
            }
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || `API Error ${res.status}`);
        }
        return res.json();
    }

    async function forceDownloadFile(url, filename) {
        try {
            setStatus(`⬇️ Mengunduh file "${filename}"...`, '#ffea00');
            const res = await fetch(url);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
        } catch (_) {
            window.open(url, '_blank');
        }
    }

    async function downloadDirect(id, type, title = '') {
        try {
            let finalTitle = title || id;
            if (!title && type !== 'sfx') {
                const meta = await apiFetch(`/tracks/metadata?trackId=${id}`).catch(() => []);
                if (meta && meta[0]) {
                    const artist = meta[0].mainArtists?.join(', ') || '';
                    finalTitle = artist ? `${meta[0].title} - ${artist}` : meta[0].title;
                }
            }
            const cleanName = finalTitle.replace(/[\\/:*?"<>|]/g, '_');

            setStatus(`⏳ Mengambil link download "${finalTitle}"...`, '#ffea00');

            if (type === 'sfx') {
                const data = await apiFetch(`/sound-effects/${id}/download?format=mp3&quality=high`);
                await forceDownloadFile(data.url, `${cleanName} [SFX].mp3`);
                setStatus(`✅ SFX "${finalTitle}" Berhasil Didownload!`, '#00e676');
            } else if (type === 'stems') {
                try {
                    const job = await apiFetch(`/tracks/versions`, {
                        method: 'POST',
                        body: JSON.stringify({ trackId: id, durationMs: 120000 })
                    });
                    if (job.jobId) {
                        setStatus(`🎛 Memproses WAV/Stems "${finalTitle}"...`, '#2979ff');
                        await pollVersionJob(job.jobId, cleanName);
                        queryInput.value = '';
                        queryInput.focus();
                        return;
                    }
                } catch (_) {}
                const data = await apiFetch(`/tracks/${id}/download?format=mp3&quality=high`);
                await forceDownloadFile(data.url, `${cleanName} [STEMS].mp3`);
                setStatus(`✅ Stems/Audio "${finalTitle}" Berhasil Didownload!`, '#00e676');
            } else {
                const data = await apiFetch(`/tracks/${id}/download?format=mp3&quality=high`);
                await forceDownloadFile(data.url, `${cleanName}.mp3`);
                setStatus(`✅ Track "${finalTitle}" Berhasil Didownload!`, '#00e676');
            }
            queryInput.value = '';
            queryInput.focus();
        } catch (err) {
            setStatus(`❌ ${err.message}`, '#ff5252');
        }
    }

    async function pollVersionJob(jobId, cleanName) {
        for (let i = 0; i < 25; i++) {
            await new Promise(r => setTimeout(r, 2000));
            const res = await apiFetch(`/tracks/versions/${jobId}`);
            if (res.status === 'COMPLETED' && res.results?.[0]) {
                const wavUrl = res.results[0].highQualityUrl || res.results[0].previewUrl;
                const ext = res.results[0].highQualityUrl ? 'wav' : 'mp3';
                await forceDownloadFile(wavUrl, `${cleanName} [WAV].${ext}`);
                setStatus(`✅ WAV/Stems "${cleanName}" Berhasil Didownload!`, '#00e676');
                return;
            }
            if (res.status === 'FAILED') throw new Error('Gagal generate versi WAV/Stems.');
        }
        throw new Error('Timeout menunggu proses stems.');
    }

    async function handleAction(type) {
        const raw = queryInput.value.trim();
        if (!raw) return setStatus('⚠️ Paste Link atau Ketik Judul dulu!', '#ff5252');

        resultsEl.innerHTML = '';
        setStatus(`⏳ Memproses ${type.toUpperCase()}...`, '#ffea00');

        try {
            const extracted = extractId(raw);
            const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(extracted || '');

            if (isUuid) {
                const autoType = raw.includes('/sound-effects/') ? 'sfx' : type;
                await downloadDirect(extracted, autoType, '');
                return;
            }

            const searchTerm = encodeURIComponent(extracted || raw);

            if (type === 'sfx') {
                const data = await apiFetch(`/sound-effects/search?term=${searchTerm}&limit=5&sort=best-match&order=desc`);
                const list = data.soundEffects || [];
                if (!list.length) return setStatus('❌ SFX tidak ditemukan.', '#ff5252');
                renderResults(list, 'sfx');
                await downloadDirect(list[0].id, 'sfx', list[0].title);
            } else {
                const vocalFilter = type === 'stems' ? '&vocalType=NONE' : '';
                const data = await apiFetch(`/tracks/search?term=${searchTerm}&limit=5&sort=Relevance&order=desc${vocalFilter}`);
                const list = data.tracks || [];
                if (!list.length) return setStatus('❌ Track tidak ditemukan.', '#ff5252');
                renderResults(list, type);
                const firstArtist = list[0].mainArtists?.join(', ') || '';
                const firstName = firstArtist ? `${list[0].title} - ${firstArtist}` : list[0].title;
                await downloadDirect(list[0].id, type, firstName);
            }
        } catch (err) {
            setStatus(`❌ ${err.message}`, '#ff5252');
        }
    }

    function renderResults(items, type) {
        resultsEl.innerHTML = items.map(item => {
            const artist = item.mainArtists ? item.mainArtists.join(', ') : 'SFX';
            const fullName = item.mainArtists ? `${item.title} - ${artist}` : item.title;
            const safeTitle = fullName.replace(/'/g, "\\'");
            return `
                <div class="item">
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-sub">${artist} • ${item.length || 0}s ${item.bpm ? '• ' + item.bpm + ' BPM' : ''}</div>
                    </div>
                    <button class="dl-btn" onclick="downloadDirect('${item.id}', '${type}', '${safeTitle}')">⬇ UNDUH</button>
                </div>
            `;
        }).join('');
    }
</script>

</body>
</html>
